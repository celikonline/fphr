name: Workstation deploy

# Workstation'daki canlı senseik kurulumunu (~/uygulamalar/senseik) main'e
# eşitler. Runner: makinedeki self-hosted "workstation" (label: senseik) —
# dışarıdan erişim gerekmez.

# İnsan onayı olmadan CI/CD başlamaz: yalnız elle (Actions > Run workflow)
# tetiklenir. Otomatik deploy'u geri açmak için aşağıdaki bloğu yorumdan çıkarın.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

concurrency:
  group: workstation-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, senseik]
    timeout-minutes: 30
    steps:
      - name: Canlı dizini main'e eşitle
        run: |
          cd "$HOME/uygulamalar/senseik"
          git fetch "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" main
          git reset --hard FETCH_HEAD   # .env ve override untracked — dokunulmaz

      - name: Taban imajlar (Docker Hub limitine karşı ayna)
        # Docker Hub anonim çekimi IP başına sınırlı (429 Too Many Requests, 30.09'da
        # deploy'u düşürdü). Yerelde olmayan Docker Hub taban imajları Google'ın
        # aynasından (mirror.gcr.io) çekilip aynı adla etiketlenir; derleme yerel kopyayı kullanır.
        run: |
          cd "$HOME/uygulamalar/senseik"
          for img in $(grep -hoE '^FROM [^ ]+' web/Dockerfile src/Sense.Api/Dockerfile src/Sense.Worker/Dockerfile | awk '{print $2}' | sort -u); do
            case "$img" in *.*/*) continue;; esac          # mcr.microsoft.com vb. Docker Hub dışı
            docker image inspect "$img" >/dev/null 2>&1 && continue
            ref="$img"; case "$ref" in */*) ;; *) ref="library/$ref";; esac
            docker pull -q "mirror.gcr.io/$ref" && docker tag "mirror.gcr.io/$ref" "$img"
          done

      - name: Build
        run: cd "$HOME/uygulamalar/senseik" && docker compose build

      - name: Migrasyon (uygulamadan ÖNCE)
        # Yeni kod eski şemayla açılırsa açılış seed'i/sorguları düşer (30.09'da yaşandı):
        # önce api+worker durur, şema güncellenir, sonra yeni sürüm başlar. Veri silinmez.
        run: |
          cd "$HOME/uygulamalar/senseik"
          docker compose stop api worker
          PGS=$(grep ^POSTGRES_PASSWORD .env | cut -d= -f2)
          docker run --rm --network senseik_default \
            -v "$HOME/uygulamalar/senseik":/src -w /src -v senseik_nuget:/root/.nuget \
            -e ConnectionStrings__Database="Host=senseik-postgres;Port=5432;Database=senseik;Username=sense;Password=$PGS" \
            mcr.microsoft.com/dotnet/sdk:10.0 dotnet run --project src/Sense.Migrator -- migrate

      - name: Up
        run: cd "$HOME/uygulamalar/senseik" && docker compose up -d

      - name: Web'i tazele
        # nginx upstream IP'yi açılışta çözer — api yeniden yaratıldıysa web
        # tazelenmezse 502 verir (22.09'da yaşandı).
        run: cd "$HOME/uygulamalar/senseik" && docker compose restart web

      - name: Sağlık kontrolü
        run: |
          sleep 5
          curl -fsS -o /dev/null http://localhost:13000/
          K=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:13000/api/v1/identity/auth/login -H 'Content-Type: application/json' -d '{}')
          echo "api-proxy login (bos govde): $K"
          case "$K" in 400|401|422) exit 0;; *) echo "beklenmeyen: $K"; exit 1;; esac
