name: CodeQL

# PAUSED: automatic triggers are disabled for now; only manual runs (workflow_dispatch)
# are possible. Restore the commented block below to re-enable.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  # schedule:
  #   # Weekly scan even if there's no new push, so freshly-disclosed CVEs against
  #   # unchanged code still get caught.
  #   - cron: "23 3 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - if: matrix.build-mode == 'manual'
        run: dotnet build Sense.slnx -c Release

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
