name: PR

# PAUSED: automatic triggers are disabled for now; only manual runs (workflow_dispatch)
# are possible. Restore the commented block below to re-enable.
on:
  workflow_dispatch:
  # pull_request:
  #   branches: [main]
  # push:
  #   branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Determines which parts of the monorepo changed so unrelated pipelines
  # (backend / web / mobile) are skipped on PRs that don't touch them.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'tests/**'
              - '*.slnx'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'global.json'
              - '.github/workflows/pr.yml'
            web:
              - 'web/**'
              - 'packages/**'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.github/workflows/pr.yml'
            mobile:
              - 'apps/senseik-mobile/**'
              - 'packages/**'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.github/workflows/pr.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: senseik_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj
      - name: Restore
        run: dotnet restore Sense.slnx
      - name: Format check
        run: dotnet format Sense.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build Sense.slnx -c Release --no-restore

      - name: Architecture Tests (Fail Fast)
        run: dotnet test tests/Sense.Tests.Architecture/ -c Release --no-build --logger "console;verbosity=normal" --logger "trx;LogFileName=architecture-tests.trx"

      - name: Unit Tests
        env:
          ConnectionStrings__Database: Host=127.0.0.1;Port=5432;Database=senseik_test;Username=postgres;Password=postgres
          ConnectionStrings__Redis: 127.0.0.1:6379,abortConnect=false
          SENSE_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Username=postgres;Password=postgres;Database=postgres
        run: dotnet test Sense.slnx -c Release --no-build --filter "Category!=Integration" --logger "trx;LogFileName=unit-tests.trx" --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Integration Tests
        env:
          ConnectionStrings__Database: Host=127.0.0.1;Port=5432;Database=senseik_test;Username=postgres;Password=postgres
          ConnectionStrings__Redis: 127.0.0.1:6379,abortConnect=false
          SENSE_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Username=postgres;Password=postgres;Database=postgres
        run: dotnet test Sense.slnx -c Release --no-build --filter "Category=Integration" --logger "trx;LogFileName=integration-tests.trx" --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: TestResults/**/*.trx
          check_name: Test Results
          comment_mode: always

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web type-check
      - run: pnpm --filter web test -- --run --passWithNoTests
      - run: pnpm --filter web build

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: "apps/senseik-mobile/.nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @senseik/mobile lint
      - run: pnpm --filter @senseik/mobile type-check
      - run: pnpm --filter @senseik/mobile test -- --ci
      # NOTE: EAS builds (native binaries for TestFlight / Play Store) are intentionally not run
      # here - they require eas.json plus an Expo account/token secret. Wire up a separate,
      # manually-triggered workflow once the project is ready to ship native builds.

  # Single stable required-status-check for branch protection: succeeds whenever every
  # job that actually ran succeeded, regardless of which jobs were skipped by path filters.
  pr-status:
    needs: [changes, backend, web, mobile]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required jobs
        run: |
          for result in "${{ needs.backend.result }}" "${{ needs.web.result }}" "${{ needs.mobile.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "A required job failed: $result"
              exit 1
            fi
          done
          echo "All required jobs passed (or were skipped as not applicable)."
