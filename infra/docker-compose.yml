name: senseik

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: senseik-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sense}
      POSTGRES_DB: ${POSTGRES_DB:-senseik}
      TZ: Europe/Istanbul
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - senseik_pg:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sense} -d ${POSTGRES_DB:-senseik}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: senseik-redis
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # MinIO pulled minio/minio and minio/mc off Docker Hub; quay.io/minio/* is the
    # image source they now publish to.
    image: quay.io/minio/minio:latest
    container_name: senseik-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - senseik_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: senseik-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minio} ${MINIO_ROOT_PASSWORD:-minio12345} &&
      mc mb --ignore-existing local/senseik-files &&
      mc mb --ignore-existing local/senseik-public &&
      mc anonymous set download local/senseik-public &&
      echo 'buckets ready'
      "

  mailpit:
    image: axllent/mailpit:latest
    container_name: senseik-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: senseik-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-sense}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-sense}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    profiles: ["bus"]

  seq:
    image: datalust/seq:latest
    container_name: senseik-seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "${SEQ_PORT:-5341}:80"
    profiles: ["obs"]

  # --- Observability (profile "obs") ---------------------------------------------------------------
  # Traces:  Sense.Api --OTLP/gRPC--> jaeger:4317        (UI: http://localhost:16686)
  # Metrics: prometheus --scrape--> Sense.Api /metrics   (UI: http://localhost:9090)
  # Logs:    Sense.Api --OTLP/HTTP--> loki:3100/otlp
  # Grafana (http://localhost:3001) üçünü de datasource olarak alır; dashboard'lar otomatik yüklenir.
  # Başlatma: docker compose -f infra/docker-compose.yml --profile obs up -d

  jaeger:
    # Jaeger v2 (OpenTelemetry Collector tabanlı); v1 all-in-one imajı artık geliştirilmiyor.
    # 2.20.0'a sabit: 2.21.0 eski /api/services|traces HTTP API'sini kaldırdı, Grafana'nın Jaeger datasource'u
    # hâlâ bu API'yi kullanıyor (yükseltmeden önce Grafana → Connections → Jaeger → "Save & test" ile doğrulayın).
    image: jaegertracing/jaeger:2.20.0
    container_name: senseik-jaeger
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    profiles: ["obs"]

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: senseik-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - senseik_prometheus:/prometheus
    # API host'ta (dotnet run) çalışırken scrape edebilmek için (Linux'ta host.docker.internal varsayılan değildir).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    profiles: ["obs"]

  loki:
    image: grafana/loki:3.7.7
    container_name: senseik-loki
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - senseik_loki:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    profiles: ["obs"]

  grafana:
    image: grafana/grafana:13.2.1
    container_name: senseik-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/senseik-api-overview.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - senseik_grafana:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
      - loki
      - jaeger
    profiles: ["obs"]

volumes:
  senseik_pg:
  senseik_minio:
  senseik_prometheus:
  senseik_loki:
  senseik_grafana:
