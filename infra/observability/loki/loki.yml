# Loki - tek süreç (monolithic), dosya sistemi depolamalı local geliştirme yapılandırması.
# Sense.Api loglarını OTLP/HTTP ile http://loki:3100/otlp/v1/logs adresine gönderir (Serilog.Sinks.OpenTelemetry).

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # OTLP log attribute'ları (CorrelationId, TenantId, trace_id...) structured metadata olarak saklanır.
  allow_structured_metadata: true
  # Grafana "Logs Drilldown" ve seviye bazlı grafikler için.
  discover_log_levels: true
  volume_enabled: true
  retention_period: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

pattern_ingester:
  enabled: true

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

analytics:
  reporting_enabled: false
