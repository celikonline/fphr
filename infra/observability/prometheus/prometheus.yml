# Prometheus - SenseİK local observability stack (infra/docker-compose.yml, profile "obs").
# Sense.Api metrikleri OpenTelemetry Prometheus exporter'ı ile /metrics uç noktasından sunar (bkz. docs/observability.md).

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # API container olarak çalışırken (repo kökündeki docker-compose.yml, "api" servisi).
  - job_name: senseik-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
        labels:
          runtime: container

  # API host'ta `dotnet run` ile çalışırken (launchSettings: https://localhost:5001). UseHttpsRedirection http'yi
  # https'e yönlendirdiğinden doğrudan https scrape edilir; dev sertifikası host.docker.internal için geçerli değildir.
  - job_name: senseik-api-host
    scheme: https
    metrics_path: /metrics
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["host.docker.internal:5001"]
        labels:
          runtime: host
    relabel_configs:
      # Dashboard'lar ve alarmlar tek bir job adına bakar.
      - target_label: job
        replacement: senseik-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: jaeger
    static_configs:
      - targets: ["jaeger:8888"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
