apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: senseik-ingress
  namespace: senseik-prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.example.com
        - app.example.com
      secretName: senseik-tls
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prod-api
                port:
                  number: 8080
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prod-web
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: senseik-internal-ingress
  namespace: senseik-prod
spec:
  ingressClassName: nginx
  rules:
    - host: mailpit.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prod-mailpit
                port:
                  number: 8025
