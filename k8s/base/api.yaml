apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: senseik
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: senseik
spec:
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: senseik-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: Production
        - name: ASPNETCORE_URLS
          value: http://+:8080
        - name: DOTNET_RUNNING_IN_CONTAINER
          value: "true"
        - name: ConnectionStrings__Database
          valueFrom:
            secretKeyRef:
              name: api-secret
              key: databaseConnection
        - name: ConnectionStrings__Redis
          value: redis:6379,abortConnect=false
        - name: Storage__Provider
          value: MinIO
        - name: MinIO__Endpoint
          value: minio:9000
        - name: MinIO__PublicEndpoint
          value: minio:9000
        - name: MinIO__AccessKey
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: rootUser
        - name: MinIO__SecretKey
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: rootPassword
        - name: MinIO__UseHttps
          value: "false"
        - name: Email__Smtp__Host
          value: mailpit
        - name: Email__Smtp__Port
          value: "1025"
        - name: Frontend__BaseUrl
          value: http://localhost:3000
        - name: Seeding__Enabled
          value: "false"
        - name: SENTRY_DSN
          valueFrom:
            secretKeyRef:
              name: api-secret
              key: sentryDsn
              optional: true
        - name: Observability__OtlpEndpoint
          value: http://jaeger:4317
        - name: Observability__Logs__Enabled
          value: "true"
        - name: Observability__Logs__Endpoint
          value: http://loki:3100/otlp/v1/logs
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
      initContainers:
      - name: wait-for-db
        image: busybox:latest
        command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done;']
      - name: migrate-db
        image: senseik-api:latest
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - |
            dotnet Sense.Migrator.dll migrate
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: Production
        - name: ConnectionStrings__Database
          valueFrom:
            secretKeyRef:
              name: api-secret
              key: databaseConnection
